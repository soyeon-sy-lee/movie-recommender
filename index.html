<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>인생영화 기반 추천기</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172026;
      --muted: #65717b;
      --page: #f5f1e9;
      --panel: #fffdf8;
      --panel-soft: #eee4d8;
      --line: #ddd2c5;
      --accent: #b9413b;
      --accent-deep: #a63b34;
      --accent-ink: #fff8ed;
      --hero: #3d3432;
      --shadow: 0 18px 52px rgba(61, 41, 31, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
      background: var(--page);
      color: var(--ink);
      line-height: 1.55;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(320px, 372px) minmax(0, 1fr);
    }

    .control-panel {
      padding: 34px 28px;
      background: var(--panel);
      border-right: 1px solid var(--line);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--ink);
      color: #fff7e5;
      font-weight: 900;
      letter-spacing: 0;
      box-shadow: inset 0 -8px 0 rgba(255, 255, 255, 0.08);
    }

    h1,
    h2,
    p {
      margin: 0;
      letter-spacing: 0;
    }

    h1 {
      font-size: 24px;
      line-height: 1.18;
    }

    .tagline {
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
    }

    .form {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      color: #3d454c;
      font-size: 13px;
      font-weight: 700;
    }

    .autocomplete {
      position: relative;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 14px 15px;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(185, 65, 59, 0.14);
    }

    .suggestions {
      position: absolute;
      z-index: 20;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      display: none;
      max-height: 260px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffdf8;
      box-shadow: 0 18px 44px rgba(61, 41, 31, 0.18);
    }

    .suggestions.open {
      display: block;
    }

    .suggestion-item {
      width: 100%;
      min-height: 48px;
      padding: 9px 12px;
      border-bottom: 1px solid #eee3d5;
      background: transparent;
      color: var(--ink);
      text-align: left;
      display: grid;
      gap: 2px;
    }

    .suggestion-item:hover,
    .suggestion-item.active {
      background: #fff2df;
    }

    .suggestion-item strong {
      font-size: 14px;
    }

    .suggestion-item span {
      color: var(--muted);
      font-size: 12px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .actions.has-results {
      grid-template-columns: 1fr auto;
      align-items: center;
    }

    .primary,
    .secondary {
      min-height: 48px;
      border-radius: 8px;
      padding: 0 16px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }

    .primary {
      background: var(--accent);
      color: var(--accent-ink);
    }

    .secondary {
      background: var(--panel-soft);
      color: #453a31;
    }

    .secondary.is-hidden {
      display: none;
    }

    .secondary:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .helper {
      margin-top: 18px;
      color: #645a4d;
      font-size: 13px;
    }

    .helper strong {
      color: #3f372f;
    }

    .workspace {
      padding: 34px;
      display: grid;
      gap: 20px;
      align-content: start;
    }

    .cinema-strip {
      min-height: 176px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.09) 8px, transparent 8px 34px, rgba(255, 255, 255, 0.09) 34px 42px),
        linear-gradient(135deg, #262625, var(--hero) 58%, #8f5440);
      background-size: 42px 100%, 100% 100%;
      color: #fff8e9;
      padding: 30px 32px;
      display: grid;
      align-content: end;
      overflow: hidden;
      position: relative;
      box-shadow: var(--shadow);
    }

    .cinema-strip::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(0, 0, 0, 0.18), transparent 48%);
      pointer-events: none;
    }

    .cinema-strip::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 12px;
      background: repeating-linear-gradient(90deg, rgba(255, 248, 233, 0.58) 0 12px, transparent 12px 24px);
    }

    .cinema-strip h2 {
      max-width: 800px;
      position: relative;
      font-size: clamp(40px, 4vw, 56px);
      line-height: 1.06;
      font-weight: 900;
    }

    .cinema-strip p {
      max-width: 720px;
      margin-top: 12px;
      position: relative;
      color: rgba(255, 248, 233, 0.82);
    }

    .result-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 20px;
      line-height: 1.2;
      font-weight: 900;
    }

    .set-count {
      border: 1px solid #e2d8ca;
      border-radius: 999px;
      background: rgba(255, 253, 248, 0.74);
      color: #6d6257;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .taste-box {
      display: none;
      border-left: 4px solid var(--accent);
      background: rgba(255, 253, 248, 0.88);
      padding: 17px 18px;
      border-radius: 0 8px 8px 0;
      box-shadow: 0 8px 28px rgba(63, 44, 33, 0.07);
    }

    .taste-box.is-visible {
      display: block;
    }

    .taste-box strong {
      display: block;
      margin-bottom: 4px;
      color: var(--ink);
    }

    .recommendations {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .movie-card {
      min-height: 320px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
      display: grid;
      grid-template-rows: 220px 1fr;
      box-shadow: 0 12px 36px rgba(63, 44, 33, 0.08);
      transition: transform 170ms ease, box-shadow 170ms ease;
    }

    .movie-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 48px rgba(63, 44, 33, 0.13);
    }

    .poster {
      padding: 18px;
      display: grid;
      align-content: end;
      color: white;
      position: relative;
      overflow: hidden;
      background: var(--poster-bg);
    }

    .poster.has-image {
      background: #221f1d;
    }

    .poster img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.01);
    }

    .poster::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(255, 255, 255, 0.36);
      border-radius: 6px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent 42%),
        linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.12));
    }

    .poster.has-image::before {
      inset: 0;
      border: 0;
      border-radius: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.05) 38%, rgba(0, 0, 0, 0.76));
    }

    .poster::after {
      content: "";
      position: absolute;
      right: 18px;
      top: 18px;
      width: 8px;
      height: 74px;
      background: repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.55) 0 8px, transparent 8px 16px);
    }

    .poster.has-image::after {
      display: none;
    }

    .poster span {
      position: relative;
      font-size: 12px;
      font-weight: 900;
      opacity: 0.86;
    }

    .poster b {
      position: relative;
      margin-top: 4px;
      font-size: 26px;
      line-height: 1;
    }

    .movie-body {
      padding: 18px;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .movie-title {
      font-size: 20px;
      font-weight: 900;
      line-height: 1.2;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
    }

    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 900;
    }

    .score-meter {
      flex: 1;
      height: 7px;
      border-radius: 999px;
      background: #eadfce;
      overflow: hidden;
    }

    .score-fill {
      display: block;
      width: var(--score-width);
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #8b5144);
    }

    .reason {
      color: #3d4550;
      font-size: 14px;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 7px;
      margin-top: 2px;
    }

    .card-action {
      min-height: 36px;
      border: 1px solid #e1d6c7;
      border-radius: 8px;
      background: #fff9ef;
      color: #4a4037;
      font-size: 18px;
      font-weight: 900;
    }

    .card-action:hover,
    .card-action.active {
      border-color: var(--accent);
      color: var(--accent);
      background: #fff1e7;
    }

    .card-action.seen {
      background: #eee4d8;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      border: 1px solid #e3d9ca;
      border-radius: 999px;
      padding: 4px 8px;
      background: #fffaf1;
      color: #5d5145;
      font-size: 12px;
      font-weight: 700;
    }

    .empty {
      min-height: 280px;
      display: grid;
      place-items: center;
      border: 1px dashed #c7bbaa;
      border-radius: 14px;
      padding: 32px;
      color: var(--muted);
      text-align: center;
      background: rgba(255, 253, 248, 0.64);
    }

    .empty strong {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
      font-size: 22px;
      line-height: 1.25;
    }

    @media (max-width: 1040px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .control-panel {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .recommendations {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      .control-panel,
      .workspace {
        padding: 22px 16px;
      }

      .actions,
      .result-head {
        grid-template-columns: 1fr;
        display: grid;
        align-items: stretch;
      }

      .set-count {
        white-space: normal;
      }

      .cinema-strip {
        min-height: 176px;
        padding: 22px;
      }

      .cinema-strip h2 {
        font-size: 36px;
      }

      .card-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="control-panel">
      <div class="brand">
        <div class="mark">3F</div>
        <div>
          <h1>인생영화 추천기</h1>
          <p class="tagline">세 편의 취향을 읽고 다음 세 편을 고릅니다.</p>
        </div>
      </div>

      <form class="form" id="movieForm">
        <label>
          인생영화 1
          <span class="autocomplete">
            <input id="movieOne" name="movieOne" placeholder="예: 이터널 선샤인" autocomplete="off" required>
            <span class="suggestions" id="movieOneSuggestions"></span>
          </span>
        </label>
        <label>
          인생영화 2
          <span class="autocomplete">
            <input id="movieTwo" name="movieTwo" placeholder="예: 라라랜드" autocomplete="off" required>
            <span class="suggestions" id="movieTwoSuggestions"></span>
          </span>
        </label>
        <label>
          인생영화 3
          <span class="autocomplete">
            <input id="movieThree" name="movieThree" placeholder="예: 그녀" autocomplete="off" required>
            <span class="suggestions" id="movieThreeSuggestions"></span>
          </span>
        </label>

        <div class="actions" id="actions">
          <button class="primary" type="submit">추천 받기</button>
          <button class="secondary is-hidden" id="rerollButton" type="button" disabled>다른 추천 보기</button>
        </div>
      </form>

      <p class="helper">
        ⓘ MovieLens 공개 데이터셋을 활용합니다.<br>
        현재 추천 후보 <strong id="datasetCount">9,000개 이상</strong>
      </p>
    </aside>

    <main class="workspace">
      <section class="cinema-strip" aria-label="서비스 소개">
        <h2>좋아한 영화 세 편이면,<br>취향의 윤곽이 선명해집니다.</h2>
        <p>장르보다 더 깊은 단서인 정서, 리듬, 결말의 온도, 인물의 고독을 함께 봅니다.</p>
      </section>

      <section class="result-head">
        <div>
          <p class="eyebrow">추천 결과</p>
        </div>
        <p class="set-count" id="setCount"></p>
      </section>

      <section class="taste-box" id="tasteBox">
        <strong>취향 해석</strong>
        <p>왼쪽에 인생영화 3편을 입력하면, 추천 이유와 함께 짧은 취향 해석이 표시됩니다.</p>
      </section>

      <section class="recommendations" id="recommendations">
        <div class="empty">
          <div>
            <strong>세 편의 영화를 입력해 주세요</strong>
            <p>입력이 끝나면 취향 분석과 추천 영화를 보여드립니다.</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="movies_dataset.js"></script>
  <script>
    const knownMovies = [
      movie("이터널 선샤인", "Eternal Sunshine of the Spotless Mind", 2004, ["romance", "memory", "melancholy", "surreal", "intimate"], "기억과 사랑의 잔상을 따라가는 영화"),
      movie("라라랜드", "La La Land", 2016, ["romance", "music", "dream", "bittersweet", "stylish"], "꿈과 사랑이 서로 다른 방향으로 빛나는 뮤지컬"),
      movie("그녀", "Her", 2013, ["romance", "loneliness", "future", "intimate", "philosophical"], "외로움과 연결 욕구를 섬세하게 바라보는 SF 로맨스"),
      movie("인셉션", "Inception", 2010, ["sci-fi", "mind", "puzzle", "action", "stylish"], "꿈의 구조를 액션 퍼즐로 설계한 영화"),
      movie("인터스텔라", "Interstellar", 2014, ["sci-fi", "space", "family", "grand", "emotional"], "우주적 스케일 안에 가족의 감정을 둔 SF"),
      movie("기생충", "Parasite", 2019, ["satire", "thriller", "class", "dark", "precise"], "계급의 긴장을 장르적으로 폭발시키는 블랙코미디"),
      movie("올드보이", "Oldboy", 2003, ["revenge", "thriller", "dark", "stylish", "tragic"], "복수와 비극을 강렬한 형식으로 밀어붙이는 영화"),
      movie("매드맥스: 분노의 도로", "Mad Max: Fury Road", 2015, ["action", "survival", "kinetic", "visual", "rebellion"], "거의 순수한 운동감으로 질주하는 액션"),
      movie("어바웃 타임", "About Time", 2013, ["romance", "family", "time", "warm", "bittersweet"], "시간 여행을 일상의 사랑으로 돌려놓는 영화"),
      movie("노트북", "The Notebook", 2004, ["romance", "memory", "classic", "emotional", "devotion"], "오래 지속되는 사랑의 감정을 정면으로 다루는 멜로"),
      movie("월-E", "WALL-E", 2008, ["animation", "loneliness", "future", "warm", "visual"], "말보다 몸짓으로 외로움과 희망을 전하는 애니메이션"),
      movie("소울", "Soul", 2020, ["animation", "music", "life", "philosophical", "warm"], "삶의 의미를 재즈처럼 가볍고 깊게 묻는 애니메이션"),
      movie("타인의 삶", "The Lives of Others", 2006, ["drama", "political", "quiet", "moral", "melancholy"], "감시와 양심 사이에서 인간성을 발견하는 드라마"),
      movie("쇼생크 탈출", "The Shawshank Redemption", 1994, ["drama", "hope", "friendship", "classic", "resilience"], "오랜 시간의 절망 속에서 희망을 지키는 영화"),
      movie("대부", "The Godfather", 1972, ["crime", "family", "classic", "power", "tragic"], "가족과 권력의 언어를 장중하게 그린 범죄 서사"),
      movie("펄프 픽션", "Pulp Fiction", 1994, ["crime", "stylish", "dialogue", "nonlinear", "dark"], "대화와 구조의 리듬으로 장르를 비트는 영화"),
      movie("센과 치히로의 행방불명", "Spirited Away", 2001, ["animation", "fantasy", "coming-of-age", "wonder", "visual"], "낯선 세계를 지나며 성장하는 환상 모험"),
      movie("너의 이름은.", "Your Name", 2016, ["animation", "romance", "time", "fate", "emotional"], "시간과 인연을 청량한 이미지로 엮은 애니메이션"),
      movie("중경삼림", "Chungking Express", 1994, ["romance", "loneliness", "city", "stylish", "melancholy"], "도시의 외로움과 우연을 감각적으로 붙잡는 영화"),
      movie("화양연화", "In the Mood for Love", 2000, ["romance", "restraint", "melancholy", "stylish", "quiet"], "말하지 못한 마음을 색과 리듬으로 남기는 영화"),
      movie("다크 나이트", "The Dark Knight", 2008, ["crime", "action", "moral", "dark", "power"], "영웅 서사를 범죄와 윤리의 딜레마로 확장한 영화"),
      movie("파이트 클럽", "Fight Club", 1999, ["mind", "identity", "dark", "satire", "nonlinear"], "불안한 자아와 소비사회의 균열을 공격적으로 파고드는 영화"),
      movie("포레스트 검프", "Forrest Gump", 1994, ["drama", "life", "hope", "warm", "classic"], "한 사람의 삶을 통해 시대와 순수를 함께 비추는 영화"),
      movie("트루먼 쇼", "The Truman Show", 1998, ["satire", "identity", "media", "hope", "philosophical"], "가짜 세계를 깨닫는 순간의 자유를 다루는 우화"),
      movie("블레이드 러너 2049", "Blade Runner 2049", 2017, ["sci-fi", "future", "identity", "visual", "melancholy"], "미래의 풍경 속에서 인간성의 조건을 묻는 SF"),

    function applyKnownMovieImages(movies, imageIds) {
      movies.forEach((movieItem) => {
        const key = movieKey(movieItem);
        const imdbId = imageIds[key];
        if (imdbId && !movieItem.id) movieItem.id = imdbId;
      });
      applyMovieImages(movies);
    }

    function applyMovieImages(movies) {
      movies.forEach((movieItem) => {
        movieItem.imageUrl = movieItem.imageUrl || buildPosterUrl(movieItem);
      });
    }

    function mergeMoviePools(...pools) {
      const seen = new Set();
      const byKey = new Map();
      const merged = [];
      pools.flat().forEach((movieItem) => {
        const key = `${normalizeTitle(movieItem.englishTitle || movieItem.title)}-${movieItem.year || ""}`;
        if (!seen.has(key)) {
          seen.add(key);
          byKey.set(key, movieItem);
          merged.push(movieItem);
        } else {
          enrichMovieImage(byKey.get(key), movieItem);
        }
      });
      return merged;
    }

    function enrichMovieImage(target, source) {
      if (!target || !source) return;
      if (!target.id && source.id) target.id = source.id;
      if (!target.imdbId && source.imdbId) target.imdbId = source.imdbId;
      if (!target.imageUrl && source.imageUrl) target.imageUrl = source.imageUrl;
      if (!target.posterUrl && source.posterUrl) target.posterUrl = source.posterUrl;
      target.imageUrl = target.imageUrl || buildPosterUrl(target);
    }

    function buildPosterUrl(movieItem) {
      const imdbId = movieItem.imdbId || movieItem.id;
      if (!imdbId || !/^tt\d+$/.test(imdbId)) return "";
      return `https://images.metahub.space/poster/medium/${imdbId}/img`;
    }

    function getMovieImageUrl(movieItem) {
      return movieItem.imageUrl || movieItem.posterUrl || buildPosterUrl(movieItem);
    }

    function hasKoreanDisplayTitle(movieItem) {
      return Boolean(movieItem.title && movieItem.englishTitle && movieItem.title !== movieItem.englishTitle);
    }

    function movieKey(movieItem) {
      return `${normalizeTitle(movieItem.englishTitle || movieItem.title)}-${movieItem.year || ""}`;
    }

    function setupAutocomplete() {
      autocompleteMovies = mergeMoviePools(knownMovies, displayRecommendationPool, recommendationPool)
        .filter((movieItem) => movieItem.title && movieItem.year);
      ["movieOne", "movieTwo", "movieThree"].forEach((inputId) => {
        const input = document.querySelector(`#${inputId}`);
        const suggestions = document.querySelector(`#${inputId}Suggestions`);
        let activeIndex = -1;
        let currentMatches = [];

        input.addEventListener("input", () => {
          currentMatches = findAutocompleteMatches(input.value);
          activeIndex = -1;
          renderSuggestions(suggestions, currentMatches, activeIndex);
        });

        input.addEventListener("focus", () => {
          currentMatches = findAutocompleteMatches(input.value);
          renderSuggestions(suggestions, currentMatches, activeIndex);
        });

        input.addEventListener("keydown", (event) => {
          if (!suggestions.classList.contains("open")) return;
          if (event.key === "ArrowDown") {
            event.preventDefault();
            activeIndex = Math.min(activeIndex + 1, currentMatches.length - 1);
            renderSuggestions(suggestions, currentMatches, activeIndex);
          }
          if (event.key === "ArrowUp") {
            event.preventDefault();
            activeIndex = Math.max(activeIndex - 1, 0);
            renderSuggestions(suggestions, currentMatches, activeIndex);
          }
          if (event.key === "Enter" && activeIndex >= 0) {
            event.preventDefault();
            selectSuggestion(input, suggestions, currentMatches[activeIndex]);
          }
          if (event.key === "Escape") {
            closeSuggestions(suggestions);
          }
        });

        suggestions.addEventListener("mousedown", (event) => {
          const button = event.target.closest("[data-suggestion-index]");
          if (!button) return;
          event.preventDefault();
          selectSuggestion(input, suggestions, currentMatches[Number(button.dataset.suggestionIndex)]);
        });

        document.addEventListener("click", (event) => {
          if (!input.parentElement.contains(event.target)) {
            closeSuggestions(suggestions);
          }
        });
      });
    }

    function findAutocompleteMatches(value) {
      const query = normalizeTitle(value);
      if (query.length < 1) return [];
      return autocompleteMovies
        .map((movieItem) => {
          const title = normalizeTitle(movieItem.title);
          const englishTitle = normalizeTitle(movieItem.englishTitle || "");
          const starts = title.startsWith(query) || englishTitle.startsWith(query);
          const includes = title.includes(query) || englishTitle.includes(query);
          if (!includes) return null;
          const score = (starts ? 3 : 1) + (isRecentMovie(movieItem) ? 0.5 : 0);
          return { movieItem, score };
        })
        .filter(Boolean)
        .sort((a, b) => b.score - a.score || Number(b.movieItem.year) - Number(a.movieItem.year))
        .slice(0, 8)
        .map((item) => item.movieItem);
    }

    function renderSuggestions(container, matches, activeIndex) {
      if (!matches.length) {
        closeSuggestions(container);
        return;
      }
      container.innerHTML = matches.map((movieItem, index) => `
        <button class="suggestion-item ${index === activeIndex ? "active" : ""}" type="button" data-suggestion-index="${index}">
          <strong>${movieItem.title}</strong>
          <span>${renderSuggestionMeta(movieItem)}</span>
        </button>
      `).join("");
      container.classList.add("open");
    }

    function renderSuggestionMeta(movieItem) {
      const english = movieItem.englishTitle && movieItem.englishTitle !== movieItem.title ? `${movieItem.englishTitle} · ` : "";
      return `${english}${movieItem.year}`;
    }

    function selectSuggestion(input, suggestions, movieItem) {
      if (!movieItem) return;
      input.value = movieItem.title;
      closeSuggestions(suggestions);
    }

    function closeSuggestions(container) {
      container.classList.remove("open");
      container.innerHTML = "";
    }

    }

    function saveLearningState() {
      localStorage.setItem(LEARNING_STORAGE_KEY, JSON.stringify(learningState));
    }

    function createEraBalancedDisplayPool(pool) {
      const recent = pool.filter(isRecentMovie);
      const old = pool.filter((movieItem) => !isRecentMovie(movieItem));
      const oldLimit = Math.floor(recent.length / RECENT_TO_OLD_RATIO);
      return [...recent, ...old.slice(0, oldLimit)];
    }

    function getInputs() {
      return [
        document.querySelector("#movieOne").value,
        document.querySelector("#movieTwo").value,
        document.querySelector("#movieThree").value
      ].map((value) => value.trim()).filter(Boolean);
    }

    function normalizeTitle(value) {
      return value.toLowerCase().replace(/[^0-9a-z가-힣]/g, "");
    }

    function buildTasteProfile(inputs) {
      const seen = new Set(inputs.map(normalizeTitle));
      const weights = {};
      const matchedTitles = [];
      const unmatchedInputs = [];

      inputs.forEach((input) => {
        const matched = findKnownMovie(input);
        if (matched) {
          matchedTitles.push(matched.title);
          seen.add(normalizeTitle(matched.title));
          seen.add(normalizeTitle(matched.englishTitle));
          matched.tags.forEach((tag, index) => {
            weights[tag] = (weights[tag] || 0) + 5 - Math.min(index, 3);
          });
        } else {
          unmatchedInputs.push(input);
          inferTagsFromText(input).forEach((tag) => {
            weights[tag] = (weights[tag] || 0) + 2;
          });
        }
      });

      if (Object.keys(weights).length === 0) {
        ["romance", "drama", "quiet", "bittersweet", "stylish"].forEach((tag) => {
          weights[tag] = 1;
        });
      }

      const topTags = Object.entries(weights)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5)
        .map(([tag]) => tag);

      return { weights, topTags, matchedTitles, unmatchedInputs, seen };
    }

    function findKnownMovie(input) {
      const normalizedInput = normalizeTitle(input);
      return searchableMovies.find((candidate) => {
        const ko = normalizeTitle(candidate.title);
        const en = normalizeTitle(candidate.englishTitle);
        return ko === normalizedInput || en === normalizedInput || ko.includes(normalizedInput) || en.includes(normalizedInput);
      });
    }

    function inferTagsFromText(input) {
      const normalized = normalizeTitle(input);
      const tags = [];
      fallbackSignals.forEach(([words, signalTags]) => {
        if (words.split(" ").some((word) => normalized.includes(normalizeTitle(word)))) {
          tags.push(...signalTags);
        }
      });
      return tags;
    }

    function rankRecommendations(profile) {
      const ranked = displayRecommendationPool
        .filter((candidate) => !profile.seen.has(normalizeTitle(candidate.title)) && !profile.seen.has(normalizeTitle(candidate.englishTitle)))
        .filter((candidate) => !learningState.seen[movieKey(candidate)])
        .map((candidate) => {
          const score = candidate.tags.reduce((total, tag) => total + (profile.weights[tag] || 0), 0);
          const varietyBonus = candidate.tags.some((tag) => !profile.topTags.includes(tag)) ? 0.8 : 0;
          const recentBonus = isRecentMovie(candidate) ? 3 : 0;
          const learnedMovieScore = learningState.movies[movieKey(candidate)] || 0;
          const learnedTagScore = candidate.tags.reduce((total, tag) => total + (learningState.tags[tag] || 0), 0);
          return { ...candidate, score: score + varietyBonus + recentBonus + learnedMovieScore + learnedTagScore };
        })
        .sort((a, b) => b.score - a.score || a.year - b.year);
      const maxScore = Math.max(...ranked.map((movieItem) => movieItem.score), 1);
      return arrangeByEraRatio(ranked.map((movieItem) => ({
        ...movieItem,
        similarity: Math.max(1, Math.min(100, Math.round((movieItem.score / maxScore) * 100)))
      })));
    }

    function isRecentMovie(movieItem) {
      return Number(movieItem.year) >= RECENT_YEAR_CUTOFF;
    }

    function arrangeByEraRatio(ranked) {
      const recent = ranked.filter(isRecentMovie);
      const old = ranked.filter((movieItem) => !isRecentMovie(movieItem));
      const arranged = [];
      let postIndex = 0;
      let preIndex = 0;

      while (postIndex < recent.length || preIndex < old.length) {
        for (let i = 0; i < RECENT_TO_OLD_RATIO && postIndex < recent.length; i += 1) {
          arranged.push(recent[postIndex]);
          postIndex += 1;
        }
        if (preIndex < old.length) {
          arranged.push(old[preIndex]);
          preIndex += 1;
        }
      }

      return arranged;
    }

    function getCurrentSetRecommendations() {
      return latestRecommendations.slice(currentSet * 3, currentSet * 3 + 3);
    }

    function refreshRanking() {
      if (!latestProfile) return;
      latestRecommendations = rankRecommendations(latestProfile);
      displayedRecommendations = displayedRecommendations
        .filter((movieItem) => !learningState.seen[movieKey(movieItem)])
        .map((movieItem) => latestRecommendations.find((candidate) => movieKey(candidate) === movieKey(movieItem)) || movieItem);
    }

    function findReplacement(excludeIndex = -1) {
      const blocked = new Set(displayedRecommendations.map(movieKey));
      if (excludeIndex >= 0 && displayedRecommendations[excludeIndex]) {
        blocked.delete(movieKey(displayedRecommendations[excludeIndex]));
      }
      return latestRecommendations.find((movieItem) => !blocked.has(movieKey(movieItem)) && !learningState.seen[movieKey(movieItem)]);
    }

    function replaceSeenMovie(index) {
      const current = displayedRecommendations[index];
      if (!current) return;
      learningState.seen[movieKey(current)] = true;
      saveLearningState();
      latestRecommendations = rankRecommendations(latestProfile);
      const blocked = new Set(displayedRecommendations
        .filter((_, itemIndex) => itemIndex !== index)
        .map(movieKey));
      const replacement = latestRecommendations.find((movieItem) => !blocked.has(movieKey(movieItem)));
      if (replacement) {
        displayedRecommendations[index] = replacement;
      } else {
        displayedRecommendations.splice(index, 1);
      }
      render();
    }

    function rateMovie(index, direction) {
      const movieItem = displayedRecommendations[index];
      if (!movieItem) return;
      const key = movieKey(movieItem);
      const previous = learningState.votes[key] || 0;
      const next = direction === "up" ? 1 : -1;
      const delta = next - previous;
      learningState.votes[key] = next;
      learningState.movies[key] = (learningState.movies[key] || 0) + delta * 2.5;
      movieItem.tags.forEach((tag) => {
        learningState.tags[tag] = (learningState.tags[tag] || 0) + delta * 0.8;
      });
      saveLearningState();
      refreshRanking();
      render();
    }

    function render() {
      const start = currentSet * 3;
      setCount.textContent = `${currentSet + 1} / 3`;
      actions.classList.add("has-results");
      rerollButton.classList.remove("is-hidden");
      rerollButton.disabled = currentSet >= 2 || latestRecommendations.length <= start + 3;
      renderTaste();
      renderCards(displayedRecommendations);
    }

    function renderTaste() {
      const tags = latestProfile.topTags.map((tag) => tagKorean[tag] || tag);
      const matched = latestProfile.matchedTitles.length ? `${latestProfile.matchedTitles.join(", ")}에서` : "입력한 세 편에서";
      const unknown = latestProfile.unmatchedInputs.length ? ` 일부 제목은 단어 분위기를 중심으로 참고했습니다.` : "";
      const learned = Object.keys(learningState.votes).length ? ` 지금까지의 평가도 추천 점수에 반영하고 있습니다.` : "";
      tasteBox.classList.add("is-visible");
      tasteBox.innerHTML = `
        <strong>당신의 영화 취향</strong>
        <p>${matched} ${tags.slice(0, 3).join(", ")}의 신호가 강하게 잡혔습니다. 익숙한 장르보다 인물의 감정선과 여운을 따라가는 선택에 더 잘 반응하는 취향으로 보여요.${unknown}${learned}</p>
        <div class="chips" aria-label="취향 태그">${tags.map((tag) => `<span class="chip">${tag}</span>`).join("")}</div>
      `;
    }

    function renderCards(selected) {
      recommendations.innerHTML = selected.map((movieItem, index) => {
        const palette = posterPalettes[(currentSet * 3 + index) % posterPalettes.length];
        const vote = learningState.votes[movieKey(movieItem)] || 0;
        const similarity = movieItem.similarity || 1;
        const matchingTags = movieItem.tags
          .filter((tag) => latestProfile.topTags.includes(tag))
          .slice(0, 3)
          .map((tag) => tagKorean[tag] || tag);
        const note = isHiddenMovieNote(movieItem.note) ? "" : movieItem.note;
        const reason = [
          matchingTags.length ? `${matchingTags.join(", ")} 취향과 맞닿아 있습니다.` : "",
          note
        ].filter(Boolean).join(" ");

        return `
          <article class="movie-card">
            ${renderPoster(movieItem, palette)}
            <div class="movie-body">
              <div>
                <div class="movie-title">${movieItem.title}</div>
                <div class="meta">${renderMeta(movieItem)}</div>
              </div>
              <div class="score-row">
                <span>유사도 ${similarity}점</span>
                <span class="score-meter" aria-hidden="true"><span class="score-fill" style="--score-width: ${similarity}%"></span></span>
              </div>
              <p class="reason">${reason}</p>
              <div class="chips">${movieItem.tags.slice(0, 4).map((tag) => `<span class="chip">${tagKorean[tag] || tag}</span>`).join("")}</div>
              <div class="card-actions">
                <button class="card-action ${vote === 1 ? "active" : ""}" type="button" data-rate="up" data-index="${index}" aria-label="붐업" title="붐업">👍</button>
                <button class="card-action ${vote === -1 ? "active" : ""}" type="button" data-rate="down" data-index="${index}" aria-label="붐다운" title="붐다운">👎</button>
                <button class="card-action seen" type="button" data-seen data-index="${index}">이미 봤어요</button>
              </div>
            </div>
          </article>
        `;
      }).join("");
      recommendations.querySelectorAll("[data-seen]").forEach((button) => {
        button.addEventListener("click", () => replaceSeenMovie(Number(button.dataset.index)));
      });
      recommendations.querySelectorAll("[data-rate]").forEach((button) => {
        button.addEventListener("click", () => rateMovie(Number(button.dataset.index), button.dataset.rate));
      });
    }

    function renderPoster(movieItem, palette) {
      const imageUrl = getMovieImageUrl(movieItem);
      const image = imageUrl
        ? `<img src="${escapeAttribute(imageUrl)}" alt="${escapeAttribute(`${movieItem.title} 이미지`)}" loading="lazy" onerror="this.closest('.poster').classList.remove('has-image'); this.remove();">`
        : "";

      return `
        <div class="poster ${image ? "has-image" : ""}" style="--poster-bg: ${palette}">
          ${image}
          <span>${movieItem.year}</span>
          <b>${movieItem.title}</b>
        </div>
      `;
    }

    function renderMeta(movieItem) {
      return `${movieItem.year}`;
    }

    function isHiddenMovieNote(note) {
      const text = String(note || "");
      return text.includes("MovieLens 공개 데이터셋")
        && text.includes("사용자 태그")
        && text.includes("추천 후보");
    }

    function escapeAttribute(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }
  </script>
